services:
  app:
    build: .
    container_name: photo-quiz
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./photos:/app/photos
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-photoquiz}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-5}
      - TRUST_PROXY=${TRUST_PROXY:-loopback, linklocal, uniquelocal}
